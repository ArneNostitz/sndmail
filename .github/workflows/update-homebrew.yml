name: Update Homebrew Tap

on:
  workflow_call:
    inputs:
      tag_name:
        description: "Release tag name"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish"
        required: false

jobs:
  update-homebrew:
    runs-on: ubuntu-latest
    steps:
      - name: Report that publishing is paused
        run: echo "Homebrew publishing is paused until sndmail has a canonical tap."
