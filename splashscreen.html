<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>sndmail</title>
  <style>
    * { box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: #eaf4ff;
      background:
        radial-gradient(ellipse at 50% 34%, rgba(40, 135, 228, 0.18), transparent 48%),
        linear-gradient(145deg, #0b1426 0%, #101b31 52%, #0b1426 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    .splash {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px;
      text-align: center;
    }

    .brand {
      display: block;
      width: min(296px, 84vw);
      height: auto;
      filter: drop-shadow(0 10px 28px rgba(32, 141, 255, 0.14));
      opacity: 0;
      animation: arrive 650ms cubic-bezier(.2,.75,.25,1) 80ms forwards;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 30px;
      color: #a8bad2;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.04em;
      opacity: 0;
      animation: arrive 500ms ease-out 360ms forwards;
    }

    .loader {
      display: flex;
      gap: 4px;
    }

    .loader span {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #64baff;
      animation: pulse 1.25s ease-in-out infinite;
    }

    .loader span:nth-child(2) { animation-delay: 160ms; }
    .loader span:nth-child(3) { animation-delay: 320ms; }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.35; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1.2); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <main class="splash" aria-label="sndmail is starting">
    <img class="brand" src="/brand/sndmail-logo-type.png" alt="sndmail" />
    <div class="status" role="status" aria-live="polite">
      <span>Starting your inbox</span>
      <span class="loader" aria-hidden="true"><span></span><span></span><span></span></span>
    </div>
  </main>
</body>
</html>
