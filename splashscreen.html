<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>snd</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0c1222 0%, #151030 35%, #1a0a2e 65%, #0f172a 100%);
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .logo { width: 180px; opacity: 0; animation: fadeIn 0.6s ease-out 0.1s forwards; }
    .loader { display: flex; gap: 6px; margin-top: 32px; opacity: 0; animation: fadeIn 0.6s ease-out 0.4s forwards; }
    .loader span { width: 5px; height: 5px; border-radius: 50%; background: #818cf8; animation: pulse 1.4s ease-in-out infinite; }
    .loader span:nth-child(2) { animation-delay: 0.2s; }
    .loader span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1.2); } }
  </style>
</head>
<body>
  <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 88" fill="none" aria-label="snd">
    <rect x="4" y="4" width="80" height="80" rx="24" fill="#0F172A"/>
    <rect x="18" y="22" width="52" height="42" rx="9" stroke="#818CF8" stroke-width="4"/>
    <path d="M20 25 44 44 68 25" stroke="#A5B4FC" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M34 48c5-7 10-8 15-3s8 5 13-2" stroke="#C4B5FD" stroke-width="4" stroke-linecap="round"/>
    <circle cx="32" cy="51" r="4" fill="#C4B5FD"/>
    <circle cx="48" cy="46" r="4" fill="#C4B5FD"/>
    <circle cx="64" cy="43" r="4" fill="#C4B5FD"/>
    <text x="108" y="62" fill="#F8FAFC" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="58" font-weight="700" letter-spacing="-4">snd</text>
  </svg>
  <div class="loader"><span></span><span></span><span></span></div>
</body>
</html>
