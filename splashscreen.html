<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>sndmail</title>
  <style>
    * { box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: #f4f8ff;
      background: #090f1b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    .card {
      position: relative;
      isolation: isolate;
      width: calc(100% - 32px);
      height: calc(100% - 32px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid rgba(177, 211, 255, 0.18);
      border-radius: 28px;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(48, 148, 255, 0.2), transparent 58%),
        linear-gradient(150deg, #14243d 0%, #101a2d 54%, #111a2a 100%);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.38), inset 0 1px rgba(255, 255, 255, 0.06);
      text-align: center;
    }

    .card::before {
      position: absolute;
      z-index: -1;
      top: -102px;
      left: 50%;
      width: 248px;
      height: 248px;
      border-radius: 50%;
      background: rgba(66, 164, 255, 0.12);
      content: "";
      filter: blur(38px);
      transform: translateX(-50%);
    }

    .logo {
      display: block;
      width: 112px;
      height: 112px;
    }

    h1 {
      margin: 13px 0 0;
      color: #f5f8ff;
      font-size: 35px;
      font-weight: 650;
      letter-spacing: -0.055em;
      line-height: 1;
    }

    .tagline {
      margin: 9px 0 0;
      color: #a9bfdc;
      font-size: 12px;
      font-weight: 450;
      letter-spacing: 0.045em;
    }

    .status {
      position: absolute;
      bottom: 24px;
      display: flex;
      align-items: center;
      gap: 9px;
      color: #b8c9df;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.035em;
    }

    .status-mark {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #66c3ff;
      box-shadow: 0 0 12px rgba(89, 185, 255, 0.75);
    }
  </style>
</head>
<body>
  <main class="card" aria-label="sndmail is starting">
    <img class="logo" src="/brand/sndmail-opening-animation.svg" alt="" />
    <h1>sndmail</h1>
    <p class="tagline">A calmer place for your inbox</p>
    <div class="status" role="status" aria-live="polite">
      <span class="status-mark" aria-hidden="true"></span>
      <span>Starting your inbox</span>
    </div>
  </main>
</body>
</html>
