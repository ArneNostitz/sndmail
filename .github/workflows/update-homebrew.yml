name: Update Homebrew Tap

on:
  workflow_call:
    inputs:
      tag_name:
        description: "Release tag name (e.g. v0.5.0)"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: "Version to sync (e.g. 0.3.14). Defaults to latest release."
        required: false

jobs:
  update-homebrew:
    # The tap token can mutate a separate repository; never run this from forks.
    if: github.repository == 'avihaymenahem/velo'
    runs-on: macos-latest
    steps:
      - name: Get version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            # Called from release-please workflow — tag_name is the full tag (e.g. v0.4.21)
            TAG="${{ inputs.tag_name }}"
          elif [ -n "${{ inputs.version }}" ]; then
            # Manual dispatch with a version — look up the actual tag from releases
            TAG=$(gh release list --repo ${{ github.repository }} --json tagName -q "[.[] | select(.tagName | test(\"${{ inputs.version }}\"))][0].tagName")
            if [ -z "$TAG" ]; then
              TAG="v${{ inputs.version }}"
            fi
          else
            # Manual dispatch without version — use latest release
            TAG=$(gh release view --repo ${{ github.repository }} --json tagName -q '.tagName')
          fi
          BARE_VERSION="${TAG##*v}"
          echo "version=${BARE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Using version: ${BARE_VERSION} (tag: ${TAG})"

      - name: Wait for DMG and compute SHA256
        id: sha
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          DMG_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/sndmail_${VERSION}_universal.dmg"

          echo "Downloading DMG from: ${DMG_URL}"
          for i in 1 2 3 4 5; do
            HTTP_CODE=$(curl -sL -o sndmail.dmg -w "%{http_code}" "$DMG_URL")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Download succeeded (attempt $i)"
              break
            fi
            echo "Attempt $i failed (HTTP $HTTP_CODE), retrying in 60s..."
            rm -f sndmail.dmg
            if [ "$i" = "5" ]; then
              echo "::error::DMG not available after 5 attempts"
              exit 1
            fi
            sleep 60
          done

          SHA256=$(shasum -a 256 sndmail.dmg | awk '{print $1}')
          echo "SHA256: ${SHA256}"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"

      - name: Checkout tap repository
        uses: actions/checkout@v4
        with:
          repository: avihaymenahem/homebrew-velo
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-velo

      - name: Update cask definition
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA256="${{ steps.sha.outputs.sha256 }}"

          cat > homebrew-velo/Casks/velo.rb << CASK_EOF
          cask "velo" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "https://github.com/avihaymenahem/velo/releases/download/v#{version}/sndmail_#{version}_universal.dmg",
                verified: "github.com/avihaymenahem/velo/"

            name "sndmail"
            desc "Local-first desktop email client"
            homepage "https://github.com/avihaymenahem/velo"

            livecheck do
              url :url
              strategy :github_latest
            end

            app "sndmail.app"

            caveats <<~EOS
              If the app is not notarized, macOS may block it on first launch.
              To allow it, right-click sndmail.app and select "Open", or run:
                xattr -cr "/Applications/sndmail.app"
            EOS

            zap trash: [
              "~/Library/Application Support/com.anydaysomething.velopro",
              "~/Library/Caches/com.anydaysomething.velopro",
              "~/Library/Preferences/com.anydaysomething.velopro.plist",
              "~/Library/Saved Application State/com.anydaysomething.velopro.savedState",
              "~/Library/WebKit/com.anydaysomething.velopro",
              "~/Library/Application Support/com.anydaysomething.sndmail",
              "~/Library/Caches/com.anydaysomething.sndmail",
              "~/Library/Preferences/com.anydaysomething.sndmail.plist",
              "~/Library/Saved Application State/com.anydaysomething.sndmail.savedState",
              "~/Library/WebKit/com.anydaysomething.sndmail",
            ]
          end
          CASK_EOF

      - name: Commit and push to tap
        working-directory: homebrew-velo
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/velo.rb
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update sndmail to ${VERSION}"
          git push
